# Supervised fine-tune of frozen-base weights on smol-smoltalk.
# Vocab is unchanged; chat is rendered with existing special tokens.
name: arzlm-100m-sft
model_config: model-arzlm-100m.yaml
out_dir: runs/arzlm-100m-sft
data_dir: data/prepared/smol-smoltalk-sft
tokenizer_dir: tokenizer/arzlm-stem-32k-v1
init_from: artifacts/ArzLM-100M-Base/LITGPT_NATIVE/lit_model.pth
precision: bf16-true
compile: true
seed: 42
devices: 1
logger_name: tensorboard
resume: auto
num_workers: 0

train:
  save_interval: 200
  log_interval: 10
  global_batch_size: 8
  micro_batch_size: 4
  lr_warmup_steps: 50
  max_tokens: 20000000
  max_seq_length: 1024
  tie_embeddings: true
  max_norm: 1.0
  min_lr: 6.0e-6

eval:
  interval: 200
  max_iters: 4
  initial_validation: false
  final_validation: true

optimizer:
  name: muon_hybrid
  class_path: arzlm.training.optim.muon.SingleDeviceMuonWithAuxAdam
  muon:
    lr: 0.01
    momentum: 0.95
    weight_decay: 0.1
    nesterov: true
    ns_steps: 5
    scale: jordan
  adamw:
    lr: 6.0e-5
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8
