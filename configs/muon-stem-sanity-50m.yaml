# 50M-token STEM-mix Muon sanity from scratch after a tokenizer change.
# Do not reuse FineWeb-Edu 50M weights.
name: muon-stem-sanity-50m
model_config: model-arzlm-100m.yaml
out_dir: runs/muon-stem-sanity-50m
data_dir: data/prepared/arzlm-stem-1b-v1
tokenizer_dir: tokenizer/arzlm-stem-32k-v1
precision: bf16-true
compile: true
seed: 42
devices: 1
logger_name: tensorboard
resume: auto
num_workers: 0

mixture:
  general: 0.55
  math: 0.20
  code: 0.15
  science: 0.10

train:
  save_interval: 200
  log_interval: 10
  global_batch_size: 8
  micro_batch_size: 4
  lr_warmup_steps: 100
  max_tokens: 50000000
  max_seq_length: 1024
  tie_embeddings: true
  max_norm: 1.0
  min_lr: 6.0e-5

eval:
  interval: 200
  max_iters: 8
  initial_validation: false
  final_validation: true

optimizer:
  name: muon_hybrid
  class_path: arzlm.training.optim.muon.SingleDeviceMuonWithAuxAdam
  muon:
    lr: 0.05
    momentum: 0.95
    weight_decay: 0.1
    nesterov: true
    ns_steps: 5
    scale: jordan
  adamw:
    lr: 6.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8
