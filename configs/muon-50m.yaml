# 50M-token experimental Muon hybrid. Architecture, tokenizer, packed 50m
# data, seed, token budget, and effective batch match adamw-50m.yaml.
#
# Selected after the expanded 2M LR bracket, compiled 10M confirmation, and
# WD check (docs/experiments.md, docs/tune/). Matched 50M candidate.
#
# Fastest stable compile for Muon: model torch.compile, CUDA graphs OFF
# (graphs/sequential-recompile can SIGSEGV with this hybrid Muon + Inductor
# stack), micro-batch 4, global batch 8. Graphs are disabled automatically for
# muon_hybrid.
#
# Muon (KellerJordan/Muon SingleDeviceMuonWithAuxAdam, pinned, not replaced):
#   hidden 2D attn/MLP weights only (75,497,472 params)
#   lr=0.05, momentum=0.95, nesterov=true, ns_steps=5, Jordan scale
#   muon weight_decay=0.1 (2M WD 0.20 is slightly better at two LRs; not
#   promoted — 2M already mis-ranked LR vs compiled 10M)
# AdamW aux (24,596,736 params): lr 6e-4, betas (0.9, 0.95), eps 1e-8, wd 0.1
name: muon-50m
model_config: model-arzlm-100m.yaml
out_dir: runs/muon-50m
data_dir: data/prepared/50m
tokenizer_dir: tokenizer/trained
precision: bf16-true
compile: true
seed: 42
devices: 1
logger_name: tensorboard
resume: auto
num_workers: 0

train:
  save_interval: 200
  log_interval: 10
  global_batch_size: 8
  micro_batch_size: 4
  lr_warmup_steps: 100
  max_tokens: 50000000
  max_seq_length: 1024
  tie_embeddings: true
  max_norm: 1.0
  min_lr: 6.0e-5

eval:
  interval: 200
  max_iters: 16
  initial_validation: false
  final_validation: true

optimizer:
  name: muon_hybrid
  class_path: arzlm.training.optim.muon.SingleDeviceMuonWithAuxAdam
  muon:
    lr: 0.05
    momentum: 0.95
    weight_decay: 0.1
    nesterov: true
    ns_steps: 5
    scale: jordan
  adamw:
    lr: 6.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8
