model_config: model-arzlm-100m.yaml
out_dir: runs/stage0-smoke
data_dir: data/prepared/tiny
tokenizer_dir: tokenizer/trained
precision: bf16-true
compile: false
seed: 42
devices: 1
logger_name: tensorboard
resume: false
num_workers: 0

train:
  save_interval: 50
  log_interval: 1
  global_batch_size: 2
  micro_batch_size: 1
  lr_warmup_steps: 1
  max_tokens: 20000
  max_steps: 5
  max_seq_length: 1024
  tie_embeddings: true
  max_norm: 1.0
  min_lr: 6.0e-5

eval:
  interval: 100
  max_iters: 2
  initial_validation: false
  final_validation: true

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 6.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
