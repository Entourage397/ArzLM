# The name of the model. Must match a key we control, not a stock LitGPT name.
name: ArzLM-300M
hf_config:
  org: ArzLM
  name: ArzLM-300M

# Context and size
block_size: 2048
n_layer: 24
n_embd: 1024
vocab_size: 32000
# 32000 is divisible by 64. LitGPT default padding_multiple=512 would expand
# the embedding table and silently add parameters.
padding_multiple: 64

# LLaMA-style block: sequential residual, RMSNorm, SwiGLU
norm_class_name: RMSNorm
norm_eps: 1.0e-5
norm_qk: true
norm_qk_type: default
post_attention_norm: false
post_mlp_norm: false
parallel_residual: false
shared_attention_norm: false
norm_1: true
norm_2: true

# Attention: 16 query heads, GQA with 4 KV groups, head_dim=64
n_head: 16
head_size: 64
n_query_groups: 4
attn_bias: false

# Full RoPE
rotary_percentage: 1.0
rope_base: 10000
rope_condense_ratio: 1

# SwiGLU MLP. intermediate_size 2816 yields 303,353,856 trainable params
# with tied embeddings (verified against litgpt 0.5.13 GPT).
intermediate_size: 2816
bias: false
mlp_class_name: LLaMAMLP
lm_head_bias: false
scale_embeddings: false
